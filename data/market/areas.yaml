# Screen reference rents by area, late 2026. Not the RERA Smart Rental Index.
# This stands in for the RERA Smart Rental Index and a firm's comps database, which are not available
# as bulk downloads (see docs/research/dubai_conventions.md, section 7). Rents are derived as
# unit-level price per sq ft x gross yield from the cited sources, then split by unit type with a
# house-view premium. Treat every value as illustrative reference data, not a valuation.

