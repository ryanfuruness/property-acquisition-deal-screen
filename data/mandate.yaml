# Firm mandate and house underwriting view.
# This is the firm's own knowledge: what it buys, how it underwrites, and its market view.
# The screen applies it to every deal. Values marked `basis: house_view` are the firm's
# judgement, not market facts; `basis: source` values cite public sources in docs/research.

firm: "Gulf Residential Income Fund I (illustrative)"
strategy: "Core-plus: stabilised, fully let residential buildings in Dubai freehold areas, bought on unlevered value; debt is sized to cover, not to lift returns"
as_of: "2026-11-21"

buy_box:
  # Hard filters fail the deal outright. Soft filters count against it but leave it for a person to decide.
  hard:
    asset_type: ["residential_building", "mixed_use_residential"]   # ground-floor retail under residential floors still counts
    title: ["freehold_single_title"]          # strata buildings and non-freehold plots are out of mandate
    areas: ["JVC", "Dubai Silicon Oasis", "International City", "Al Barsha South", "Business Bay"]
    # Al Barsha South only: Al Barsha 1, 2 and 3 are largely plots restricted to UAE and GCC nationals.
    min_units: 30
    max_units: 250
    min_price_aed: 30000000
    max_price_aed: 200000000
    min_completion_year: 2008
    no_master_lease_to_related_party: true
  soft:
    min_going_in_net_yield_on_cost: 0.060      # Year-1 NOI / (price + acquisition costs)
    target_unlevered_irr: 0.075                # the deal must work without leverage; at 2026 rates debt does not add return
    target_unlevered_equity_multiple: 1.30
    min_occupancy: 0.90
    max_lease_expiry_share_in_any_quarter: 0.40     # leases are annual, so an even spread is 25% a quarter
    max_over_rent_share_of_income: 0.20        # income from units let more than over_rent_threshold above the screen reference rent
    over_rent_threshold: 0.10                  # a unit counts as over-rented only beyond this margin; the reference is a proxy, not the RERA index

verdict_rules:
  decline_if_any_hard_fails: true
  pursue_if_soft_fails_at_most: 0
  needs_work_otherwise: true

underwriting:
  hold_years: 5
  analysis_start: "2027-01-01"
  acquisition_costs:
    dld_transfer_fee_pct: 0.04                 # basis: source (DLD), buyer pays by convention
    dld_admin_aed: 580                         # basis: source (DLD fee schedule, approx.)
    trustee_fee_aed: 4200                      # basis: source (two sources differ; immaterial)
    broker_fee_pct: 0.02                       # basis: source (market norm)
    broker_fee_vat_pct: 0.05
    mortgage_registration_pct: 0.0025          # of loan amount, basis: source (DLD)
    mortgage_registration_admin_aed: 290
  debt:
    max_ltv: 0.45                              # basis: house_view (institutional terms unverified)
    sizing_dscr: 1.40                          # loan = lower of max_ltv and the amount Year-1 NOI covers at this DSCR; basis: house_view
    base_rate_3m_eibor: 0.0430                 # basis: source (29 Oct 2026 fixing, secondary source)
    margin: 0.0250                             # basis: house_view
    amortisation_years: 15                     # basis: source (published bank terms run to 15 years)
    amortisation_years_sensitivity: 20         # shown as a sensitivity
    rate_note: "3M EIBOR held flat over the hold, unhedged; a 5-year swap would replace it in diligence"
    arrangement_fee_pct: 0.0075                # basis: house_view
  operations:
    structural_vacancy: 0.05                   # basis: house_view (falling-rent market, heavy supply)
    collection_loss: 0.01                      # basis: house_view
    renewal_probability: 0.70                  # basis: house_view
    downtime_months_on_turnover: 1.5           # basis: house_view
    leasing_fee_months_on_turnover: 0.5        # basis: source (one month's rent is common; split)
    property_management_pct_of_egi: 0.05       # basis: source 5-8% retail, institutional lower
    input_vat_on_opex_pct: 0.05                # residential rent is VAT exempt, so input VAT is a cost
    opex_growth: 0.025                         # basis: house_view
    other_income_growth: 0.0                   # basis: house_view
    opex_defaults_aed_per_sqft_nsa:            # used only when the operating statement is missing a line; basis: house_view
      maintenance_repairs: 4.0
      insurance: 1.2
      security_cleaning: 3.0
      utilities_common: 2.0
      admin_other: 0.8
      sinking_fund: 2.0
      district_cooling_if_landlord_pays: 9.0   # chiller-free buildings: landlord pays capacity and consumption
  rera:
    # Decree 43 of 2013 bands, applied at renewal to the renewing tenant's own rent against the RERA Smart Rental Index.
    # The screen has no bulk access to the index, so it uses its area reference rent as a proxy and says so;
    # any RERA claim about a specific building needs the DLD calculator. Re-lets on turnover are not capped.
    increase_bands:
      - {below_index_up_to: 0.10, max_increase: 0.00}
      - {below_index_up_to: 0.20, max_increase: 0.05}
      - {below_index_up_to: 0.30, max_increase: 0.10}
      - {below_index_up_to: 0.40, max_increase: 0.15}
      - {below_index_up_to: 1.00, max_increase: 0.20}
    notice_days_for_change: 90
  market_view:                                 # basis: house_view, informed by docs/research (rents falling in 2026)
    rent_growth_by_year:                       # applied to market reference rents
      default: [-0.03, -0.01, 0.02, 0.03, 0.03, 0.03]       # year 6 is the exit year's forward NOI; reference rents
                                                            # are partly H1 2026 data, so 2027 carries the rest of the fall
      International City: [-0.01, 0.00, 0.02, 0.03, 0.03, 0.03]
    exit_net_yield_by_area:
      JVC: 0.0650
      Dubai Silicon Oasis: 0.0675
      International City: 0.0725
      Al Barsha South: 0.0675
      Business Bay: 0.0600
    exit_yield_rule: "exit yield = max(area house view, the deal's Year-1 NOI yield on price) + expansion + age premium"
    exit_yield_expansion_bps: 25               # never exit below where we bought, plus a cushion
    exit_age_premium_bps: 25                   # added when the building is 20 years or older at exit
    exit_age_premium_from_years: 20
    selling_costs_pct: 0.02
  tax:
    corporate_tax_rate: 0.09                   # basis: source (UAE CT)
    corporate_tax_threshold_aed: 375000
    model: "indicative only: taxable income = NOI - interest - arrangement fee amortisation; no depreciation; exit gain taxed at the same rate; ignores the holding vehicle (QIF/REIT regimes under Cabinet Decision 34/2025). The screen decides on pre-tax returns."
